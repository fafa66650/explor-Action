<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explor’Action V5.4 — Générateur privé</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#07130d;color:#fff;margin:0;padding:24px}main{max-width:850px;margin:auto}.card{background:#102019;border:1px solid #284b38;border-radius:18px;padding:20px;margin:16px 0}.danger{background:#4c1212;border:1px solid #b74747;padding:14px;border-radius:12px}label{display:block;margin:14px 0 6px;font-weight:800}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #426652;background:#09150f;color:#fff}button{padding:12px 16px;border:0;border-radius:10px;background:#35e078;color:#041008;font-weight:900;cursor:pointer;min-height:44px}button.secondary{background:#22372b;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}small{color:#b7c7bd}.hidden{display:none}</style></head><body><main><h1>Explor’Action V5.4 QUALITY — Générateur privé</h1><div class="danger"><b>NE JAMAIS PUBLIER CE DOSSIER.</b><br>Il contient la clé privée ECDSA P-256 active de la V5.4.</div><section class="card"><label>Type de code</label><select id="type"><option value="player">Code joueur</option><option value="admin">Accès organisateur</option></select><div id="playerScope"><label>Portée</label><select id="scope"><option value="all">Toutes les aventures publiées</option><optgroup label="Territoires"><option value="territory:argeles">Argelès-sur-Mer — toutes les aventures publiées</option><option value="territory:standre">Saint-André — toutes les aventures publiées</option><option value="territory:collioure">Collioure — toutes les aventures publiées</option><option value="territory:portvendres">Port-Vendres — toutes les aventures publiées</option><option value="territory:banyuls">Banyuls-sur-Mer — toutes les aventures publiées</option></optgroup><optgroup label="Aventures"><option value="maillol">Banyuls-sur-Mer — L’Héritage Maillol</option><option value="vignes">Banyuls-sur-Mer — Le Secret des Vignes</option><option value="art">Banyuls-sur-Mer — Banyuls, Musée à Ciel Ouvert</option><option value="nature">Banyuls-sur-Mer — Entre Terre &amp; Méditerranée</option><option value="pv-sentinelles-port">Port-Vendres — Les Sentinelles du Port</option><option value="co-regards-collioure">Collioure — Les Regards de Collioure</option><option value="ar-fil-argeles">Argelès-sur-Mer — Le Fil d’Argelès</option><option value="sa-sceau-pierres">Saint-André — Le Sceau des Pierres</option><option value="pv-cap-signaux">Port-Vendres — Le Cap des Signaux</option><option value="pv-muletiers-schiste">Port-Vendres — Les Muletiers de Schiste</option><option value="pv-ligne-forts">Port-Vendres — Expédition spéciale — La Ligne des Forts</option><option value="co-code-fauve">Collioure — Le Code Fauve</option><option value="co-hauts-toits">Collioure — Au-dessus des Toits</option><option value="co-signal-madeloc">Collioure — Le Signal de la Madeloc</option><option value="ar-ligne-bleue">Argelès-sur-Mer — La Ligne Bleue</option><option value="ar-pierres-valmy">Argelès-sur-Mer — Les Pierres de Valmy</option><option value="ar-vigie-massane">Argelès-sur-Mer — La Vigie de la Massane</option><option value="sa-chroniques-abbaye">Saint-André — Les Chroniques de l’Abbaye</option><option value="sa-pierres-images">Saint-André — Des Pierres aux Images</option><option value="sa-portes-albere">Saint-André — Les Portes de l’Albère</option><option value="ba-ligne-rivage">Banyuls-sur-Mer — La Ligne du Rivage</option><option value="ba-expedition-walter">Banyuls-sur-Mer — Expédition spéciale — La Trace de Walter Benjamin</option><option value="pv-voie-verte">Port-Vendres — La Voie des Anses</option><option value="co-fauve-plat">Collioure — La Palette au Ras de l’Eau</option><option value="co-expedition-forts">Collioure — Expédition spéciale — Les Hauts des Forts</option><option value="ar-front-mer-plat">Argelès-sur-Mer — La Grande Ligne Bleue</option><option value="ar-expedition-massane">Argelès-sur-Mer — Expédition spéciale — Massane 19</option><option value="sa-coeur-plat">Saint-André — Le Cœur Roman Sans Détour</option></optgroup></select></div><label>Durée en heures (3 à 720)</label><input id="hours" type="number" min="3" max="720" value="24"><div class="row" style="margin-top:16px"><button id="generate">Générer le code signé</button><button class="secondary" id="copy" disabled>Copier</button></div><label>Code signé V5.4</label><textarea id="out" rows="7" readonly></textarea><p id="info"><small>Fonctionne hors ligne. Portée, émission, expiration, identifiant de clé et nonce sont protégés par la signature.</small></p></section></main><script>const PRIVATE_KEY={"key_ops":["sign"],"ext":true,"kty":"EC","x":"qii46hISdPRes3l3xjnIWduApWmuuHPADLBdOLOuTRw","y":"dqbMtZ4IDfebDiz98TrVa0Bmx6ZnAa3k7voi9uZHj3s","crv":"P-256","d":"EJoiqYs1tWWKE1v4allYk3goefKJjrritLewXHHtdwA"};const KEY_ID='explor-action-v54-20260910-a';function b64u(bytes){let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function nonce(){const a=new Uint8Array(16);crypto.getRandomValues(a);return b64u(a)}function refresh(){document.querySelector('#playerScope').classList.toggle('hidden',document.querySelector('#type').value==='admin')}async function generate(){const hours=Math.max(3,Math.min(720,Number(document.querySelector('#hours').value)||24));const role=document.querySelector('#type').value==='admin'?'admin':'player';const now=Date.now();const payload={version:'5.4.0',role,scope:role==='admin'?'admin':document.querySelector('#scope').value,issuedAt:now,expiresAt:now+hours*3600000,keyId:KEY_ID,nonce:nonce()};const bytes=new TextEncoder().encode(JSON.stringify(payload));const key=await crypto.subtle.importKey('jwk',PRIVATE_KEY,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);const sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,bytes);const code='FAFA5.'+b64u(bytes)+'.'+b64u(sig);document.querySelector('#out').value=code;document.querySelector('#copy').disabled=false;document.querySelector('#info').innerHTML='<small>Code <b>'+role+'</b> • portée : '+payload.scope+' • expire : '+new Date(payload.expiresAt).toLocaleString('fr-FR')+' • clé : '+payload.keyId+'</small>'}document.querySelector('#type').onchange=refresh;document.querySelector('#generate').onclick=()=>generate().catch(e=>alert(e.message));document.querySelector('#copy').onclick=async()=>{const t=document.querySelector('#out').value;if(!t)return;try{await navigator.clipboard.writeText(t)}catch{document.querySelector('#out').select();document.execCommand('copy')}};refresh();</script></body></html>
